<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Preset 1 - Ocean Sunset</title>
    <!-- Browser Tab Icon -->
    <link rel="icon" href="https://i.postimg.cc/tR3Q8QdN/Icon.png">
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 256x144 Downscaled Hardware Engine Canvas -->
    <canvas id="sunsetCanvas" title="Click anywhere to hide/show bio card"></canvas>

    <!-- Interactive Glassmorphic Card Overlay -->
    <div class="viewport-overlay" id="overlay">
        <div class="profile-card">

            <!-- CARD HEADER -->
            <div class="card-header">
                <div class="avatar-frame">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTg06iFDOjWL3zJH5nayvlDdZe9a8zPXwKVD52ofrI8ew&s" alt="Avatar">
                </div>
                <div class="username">Username-Here</div>
                <div class="tagline">Status-Here</div>
            </div>

            <!-- TAB NAVIGATION (2 SECTIONS: ABOUT & GALLERY) -->
            <nav class="nav-tabs">
                <button class="tab-btn active" data-target="about">About</button>
                <button class="tab-btn" data-target="gallery">Gallery</button>
            </nav>

            <!-- SCROLLABLE CONTENT AREA -->
            <div class="card-scroll-body">

                <!-- TAB 1: ABOUT -->
                <section id="about" class="tab-pane active">
                    <div>
                        <div class="section-title">About Me</div>
                        <div class="bio-text">
                            Bio here.
                        </div>
                    </div>

                    <div>
                        <div class="section-title">Links & Socials - you can put as many as you want</div>
                        <div class="links-container">
                            <!-- LINK 1 -->
                            <a href="#" class="bio-link" target="_blank">
                                <span>⛓️ Link 1</span>
                                <span>→</span>
                            </a>
                            <!-- LINK 2 -->
                            <a href="#" class="bio-link" target="_blank">
                                <span>⛓️ Link 2</span>
                                <span>→</span>
                            </a>
                        </div>
                    </div>

                    <div>
                        <div class="section-title">Additional Info</div>
                        <div class="bio-text" style="font-family: monospace; font-size: 0.8rem; color: #ffffff;">
                            Additional Info here.
                        </div>
                    </div>
                </section>

                <!-- TAB 2: GALLERY -->
                <section id="gallery" class="tab-pane">
                    <div>
                        <div class="section-title" style="font-size: 1.15rem; margin-bottom: 16px;">Photo Gallery</div>
                        <div class="preview-grid">
                            <div class="preview-item">
                                <div class="preview-img-box review-lightbox-trigger" onclick="openImageModal('https://i.pinimg.com/474x/4b/18/36/4b1836fc79cfcc7a7351b67b9e305ada.jpg')">
                                    <img src="https://i.pinimg.com/474x/4b/18/36/4b1836fc79cfcc7a7351b67b9e305ada.jpg" alt="Gallery Art 1">
                                </div>
                                <div class="preview-link-btn">Image/Art here</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-img-box review-lightbox-trigger" onclick="openImageModal('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbdOCxpnznL6uUD2YwgT0898GdGK-0wYW8jKIdkud4yA&s=10')">
                                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbdOCxpnznL6uUD2YwgT0898GdGK-0wYW8jKIdkud4yA&s=10" alt="Gallery Art 2">
                                </div>
                                <div class="preview-link-btn">Image/Art here</div>
                            </div>
                        </div>
                    </div>
                </section>

            </div>

            <!-- COPYRIGHT FOOTER -->
            <div class="card-footer" id="cardFooter">
                © <span id="current-year"></span> SolarSailsSites. All Rights Reserved.
            </div>

            <!-- IN-CARD IMAGE MODAL LIGHTBOX VIEWER -->
            <div id="imageModal" class="image-modal">
                <button class="modal-back-btn" onclick="closeImageModal()">← Back</button>
                <div class="modal-img-container">
                    <img id="expandedModalImg" src="" alt="Expanded View">
                </div>
            </div>

        </div>
    </div>

    <!-- Bottom Focus Toggle Hint -->
    <div class="toggle-hint" id="hint">Click background to toggle view focus</div>

    <!-- External Script File -->
    <script src="script.js"></script>
</body>

</html>
